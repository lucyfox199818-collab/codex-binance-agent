name: Publish v0.1.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.0-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
            exit 0
          fi

          gh release create v0.1.0 \
            --verify-tag \
            --title "v0.1.0 - Dry-run-first Codex + CCXT MCP trading workflow" \
            --notes-file CHANGELOG.md
