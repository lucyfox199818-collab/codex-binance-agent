name: Bug report
description: Report a reproducible project, MCP, audit, or documentation problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, secrets, account balances,
        order IDs, IP addresses, and other private trading data before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ccxt-mcp
        - audit-system
        - trading-v1
        - trading-v2
        - trading-v3
        - documentation
        - installation or MCP configuration
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, WSL2, etc.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: Output of node --version
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: Output of codex --version
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only the minimum logs needed to diagnose the issue.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed all credentials, secrets, account data, and private order information.
          required: true
        - label: I reproduced this with dry-run or read-only tools where possible.
          required: true
