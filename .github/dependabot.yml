version: 2
updates:
  - package-ecosystem: npm
    directory: /ccxt-mcp
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /audit-system
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/London
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
